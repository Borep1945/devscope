name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or minimal reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, compiler and version
    validations:
      required: true
